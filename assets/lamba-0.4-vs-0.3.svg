<svg xmlns="http://www.w3.org/2000/svg" width="760" height="991" viewBox="0 0 760 991" role="img" aria-labelledby="ttl dsc"><title id="ttl">Lamba 0.4 against Lamba 0.3 and stock Qwen</title><desc id="dsc">Lamba 0.4 leads Lamba 0.3 on 7 of 13 tests, is level on 4 and trails on 2. Stock Qwen3.8-27B is shown where a run exists.</desc><style>
:root{--bg:#ffffff;--t1:#141413;--t2:#52514e;--t3:#898781;--rule:#e3e2dc;--tile:#f5f4f0;--c4:#2a78d6;--c3:#85b7eb;--cx:#9a988f}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8d86;--rule:#33332f;--tile:#242422;--c4:#3987e5;--c3:#9ec1ea;--cx:#7a7872}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:var(--t2)}
.t1{fill:var(--t1)}.t3{fill:var(--t3)}.s{font-size:11px}.h{font-size:15px;font-weight:600;fill:var(--t1)}.m{font-weight:600}
.big{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:var(--c4)}.end{text-anchor:end}
.c4{fill:var(--c4)}.c3{fill:var(--c3)}.cx{fill:var(--cx)}.tile{fill:var(--tile)}.rule{stroke:var(--rule);stroke-width:1}
</style><rect width="760" height="991" rx="12" fill="var(--bg)"/><text x="24" y="34" class="h">Lamba 0.4 leads Lamba 0.3 on 7 of 13 tests, is level on 4 and trails on 2.</text><rect x="24" y="50" width="172" height="104" rx="8" class="tile"/><text x="38" y="88" class="big">99.2%</text><text x="38" y="106" class="s">calls a search tool when</text><text x="38" y="119" class="s">it should (first turn)</text><text x="38" y="138" class="m t1">+26.6 pts vs 0.3</text><text x="38" y="151" class="s t3">0.3: 72.6%</text><rect x="206" y="50" width="172" height="104" rx="8" class="tile"/><text x="220" y="88" class="big">84.6%</text><text x="220" y="106" class="s">MalayMMLU,</text><text x="220" y="119" class="s">generative 5k</text><text x="220" y="138" class="m t1">+2.1 pts vs 0.3</text><text x="220" y="151" class="s t3">0.3: 82.5%</text><rect x="388" y="50" width="172" height="104" rx="8" class="tile"/><text x="402" y="88" class="big">8.0/10</text><text x="402" y="106" class="s">chat tone: friendly,</text><text x="402" y="119" class="s">blind judge</text><text x="402" y="138" class="m t1">about +2.3 vs 0.3</text><text x="402" y="151" class="s t3">0.3: about 5.7</text><rect x="570" y="50" width="172" height="104" rx="8" class="tile"/><text x="584" y="88" class="big">93.3%</text><text x="584" y="106" class="s">refuses harmful prompts</text><text x="584" y="119" class="s">(with the constitution)</text><text x="584" y="138" class="m t1">+15.7 pts vs 0.3</text><text x="584" y="151" class="s t3">0.3: 77.6%</text><line x1="24" x2="736" y1="170" y2="170" class="rule"/><text x="24" y="188" class="h">Lamba 0.4 against Lamba 0.3 and stock Qwen</text><text x="24" y="206" class="s">Every bar is "higher is better" (rates where lower is better are shown as 100 minus the rate). Rows are sorted by the</text><text x="24" y="220" class="s">gap between 0.4 and 0.3, shown on the right. Stock Qwen3.8-27B appears only where we ran it. Lamba 0.4's base model is</text><text x="24" y="234" class="s">different from 0.3's, so the comparison mixes training and base.</text><rect x="24" y="247" width="10" height="10" rx="2" class="c4"/><text x="39" y="256" class="s">Lamba 0.4</text><rect x="108" y="247" width="10" height="10" rx="2" class="c3"/><text x="123" y="256" class="s">Lamba 0.3</text><rect x="192" y="247" width="10" height="10" rx="2" class="cx"/><text x="207" y="256" class="s">Stock Qwen3.8-27B</text><line x1="24" x2="736" y1="278" y2="278" class="rule"/><text x="24" y="296" class="m">0.4 ahead · 7</text><g><title>Ibu negara / negeri questions correct. Lamba 0.4: 96.1. Lamba 0.3: 61.7. Stock Qwen: not run. Gap: +34.4 points. 128 samples each.</title><text x="24" y="323.5" class="">Ibu negara / negeri questions correct</text><rect x="280" y="309.0" width="336.3" height="11" rx="3" class="c4"/><text x="622.3" y="318.5" class="s t1">96.1</text><rect x="280" y="323.0" width="216.0" height="7" rx="3" class="c3"/><text x="502.0" y="330.5" class="s">61.7</text><text x="736" y="323.5" class="m t1 end">+34.4</text></g><g><title>Does not self-introduce on "X tu apa?" (100 minus rate). Lamba 0.4: 97.4. Lamba 0.3: 68.4. Stock Qwen: not run. Gap: +29.0 points. self-intro 2.6% vs 31.6%, n=76.</title><text x="24" y="355.0" class="">Does not self-introduce on "X tu apa?"</text><text x="24" y="369.0" class="">(100 minus rate)</text><rect x="280" y="347.5" width="340.9" height="11" rx="3" class="c4"/><text x="626.9" y="357.0" class="s t1">97.4</text><rect x="280" y="361.5" width="239.4" height="7" rx="3" class="c3"/><text x="525.4" y="369.0" class="s">68.4</text><text x="736" y="362.0" class="m t1 end">+29.0</text></g><g><title>Calls a search tool when it should (first turn). Lamba 0.4: 99.2. Lamba 0.3: 72.6. Stock Qwen: not run. Gap: +26.6 points. 248 held-out prompts, first-turn subset n=124.</title><text x="24" y="397.0" class="">Calls a search tool when it should</text><text x="24" y="411.0" class="">(first turn)</text><rect x="280" y="389.5" width="347.2" height="11" rx="3" class="c4"/><text x="633.2" y="399.0" class="s t1">99.2</text><rect x="280" y="403.5" width="254.1" height="7" rx="3" class="c3"/><text x="540.1" y="411.0" class="s">72.6</text><text x="736" y="404.0" class="m t1 end">+26.6</text></g><g><title>Refuses harmful prompts, with constitution. Lamba 0.4: 93.3. Lamba 0.3: 77.6. Stock Qwen: 83.1. Gap: +15.7 points. StrongREJECT, n=313. stock Qwen 83.1%.</title><text x="24" y="440.5" class="">Refuses harmful prompts, with</text><text x="24" y="454.5" class="">constitution</text><rect x="280" y="428.0" width="326.6" height="11" rx="3" class="c4"/><text x="612.5" y="437.5" class="s t1">93.3</text><rect x="280" y="442.0" width="271.6" height="7" rx="3" class="c3"/><text x="557.6" y="449.5" class="s">77.6</text><rect x="280" y="452.0" width="290.8" height="7" rx="3" class="cx"/><text x="576.8" y="459.5" class="s">83.1</text><text x="736" y="447.5" class="m t1 end">+15.7</text></g><g><title>Malaysian facts correct. Lamba 0.4: 81.9. Lamba 0.3: 73.9. Stock Qwen: 80.2. Gap: +8.0 points. 348 samples each. stock Qwen 80.2%, same held-out facts.</title><text x="24" y="492.5" class="">Malaysian facts correct</text><rect x="280" y="473.0" width="286.7" height="11" rx="3" class="c4"/><text x="572.7" y="482.5" class="s t1">81.9</text><rect x="280" y="487.0" width="258.7" height="7" rx="3" class="c3"/><text x="544.7" y="494.5" class="s">73.9</text><rect x="280" y="497.0" width="280.7" height="7" rx="3" class="cx"/><text x="566.7" y="504.5" class="s">80.2</text><text x="736" y="492.5" class="m t1 end">+8.0</text></g><g><title>Avoids needless searches (100 minus over-search). Lamba 0.4: 98.8. Lamba 0.3: 94.6. Stock Qwen: not run. Gap: +4.2 points. over-search 1.2% vs 5.4%, 760 samples.</title><text x="24" y="529.0" class="">Avoids needless searches (100 minus</text><text x="24" y="543.0" class="">over-search)</text><rect x="280" y="521.5" width="345.8" height="11" rx="3" class="c4"/><text x="631.8" y="531.0" class="s t1">98.8</text><rect x="280" y="535.5" width="331.1" height="7" rx="3" class="c3"/><text x="617.1" y="543.0" class="s">94.6</text><text x="736" y="536.0" class="m t1 end">+4.2</text></g><g><title>MalayMMLU generative, 5k. Lamba 0.4: 84.6. Lamba 0.3: 82.5. Stock Qwen: not run. Gap: +2.1 points. 0.4 is the mean of two runs (84.74, 84.50).</title><text x="24" y="574.5" class="">MalayMMLU generative, 5k</text><rect x="280" y="560.0" width="296.1" height="11" rx="3" class="c4"/><text x="582.1" y="569.5" class="s t1">84.6</text><rect x="280" y="574.0" width="288.8" height="7" rx="3" class="c3"/><text x="574.8" y="581.5" class="s">82.5</text><text x="736" y="574.5" class="m t1 end">+2.1</text></g><line x1="24" x2="736" y1="598" y2="598" class="rule"/><text x="24" y="616" class="m">Level, within noise · 4</text><g><title>GPQA-Diamond (160 vs 155 of 198). Lamba 0.4: 80.8. Lamba 0.3: 78.3. Stock Qwen: not run. Gap: +2.5 points. noise about plus or minus 6 questions.</title><text x="24" y="643.5" class="">GPQA-Diamond (160 vs 155 of 198)</text><rect x="280" y="629.0" width="282.8" height="11" rx="3" class="c4"/><text x="568.8" y="638.5" class="s t1">80.8</text><rect x="280" y="643.0" width="274.1" height="7" rx="3" class="c3"/><text x="560.0" y="650.5" class="s">78.3</text><text x="736" y="643.5" class="m t1 end">+2.5</text></g><g><title>Finishes within token budget. Lamba 0.4: 74.8. Lamba 0.3: 72.9. Stock Qwen: 34.0. Gap: +1.9 points. g150; most budget hits are long legitimate answers. stock Qwen at penalty 1.1; 29.3 with no penalty.</title><text x="24" y="683.5" class="">Finishes within token budget</text><rect x="280" y="664.0" width="261.8" height="11" rx="3" class="c4"/><text x="547.8" y="673.5" class="s t1">74.8</text><rect x="280" y="678.0" width="255.2" height="7" rx="3" class="c3"/><text x="541.2" y="685.5" class="s">72.9</text><rect x="280" y="688.0" width="119.0" height="7" rx="3" class="cx"/><text x="405.0" y="695.5" class="s">34.0</text><text x="736" y="683.5" class="m t1 end">+1.9</text></g><g><title>Refuses harmful prompts, no system prompt. Lamba 0.4: 96.2. Lamba 0.3: 95.5. Stock Qwen: 95.5. Gap: +0.7 points. StrongREJECT, n=313. stock Qwen 95.5%.</title><text x="24" y="721.5" class="">Refuses harmful prompts, no system</text><text x="24" y="735.5" class="">prompt</text><rect x="280" y="709.0" width="336.7" height="11" rx="3" class="c4"/><text x="622.7" y="718.5" class="s t1">96.2</text><rect x="280" y="723.0" width="334.2" height="7" rx="3" class="c3"/><text x="620.2" y="730.5" class="s">95.5</text><rect x="280" y="733.0" width="334.2" height="7" rx="3" class="cx"/><text x="620.2" y="740.5" class="s">95.5</text><text x="736" y="728.5" class="m t1 end">+0.7</text></g><g><title>Clean endings (100 minus tail repetition). Lamba 0.4: 97.0. Lamba 0.3: 97.3. Stock Qwen: 90.0. Gap: −0.3 points. g150 at penalty 1.05. stock Qwen at penalty 1.1; 78.0 with no penalty.</title><text x="24" y="766.5" class="">Clean endings (100 minus tail</text><text x="24" y="780.5" class="">repetition)</text><rect x="280" y="754.0" width="339.5" height="11" rx="3" class="c4"/><text x="625.5" y="763.5" class="s t1">97.0</text><rect x="280" y="768.0" width="340.6" height="7" rx="3" class="c3"/><text x="626.5" y="775.5" class="s">97.3</text><rect x="280" y="778.0" width="315.0" height="7" rx="3" class="cx"/><text x="601.0" y="785.5" class="s">90.0</text><text x="736" y="773.5" class="m t1 end">−0.3</text></g><line x1="24" x2="736" y1="802" y2="802" class="rule"/><text x="24" y="820" class="m">0.3 ahead · 2</text><g><title>Says "Lamba" on held-out identity items. Lamba 0.4: 96.2. Lamba 0.3: 99.7. Stock Qwen: not run. Gap: −3.5 points. 0.3 partly answers "Lamba" even when another model is only mentioned.</title><text x="24" y="844.0" class="">Says "Lamba" on held-out identity</text><text x="24" y="858.0" class="">items</text><rect x="280" y="836.5" width="336.7" height="11" rx="3" class="c4"/><text x="622.7" y="846.0" class="s t1">96.2</text><rect x="280" y="850.5" width="348.9" height="7" rx="3" class="c3"/><text x="635.0" y="858.0" class="s">99.7</text><text x="736" y="851.0" class="m t1 end">−3.5</text></g><g><title>Loop-free (100 minus Liquid-style loop rate). Lamba 0.4: 93.5. Lamba 0.3: 96.0. Stock Qwen: 78.0. Gap: −2.5 points. g150 at penalty 1.05. stock Qwen at penalty 1.1; 66.0 with no penalty.</title><text x="24" y="887.5" class="">Loop-free (100 minus Liquid-style loop</text><text x="24" y="901.5" class="">rate)</text><rect x="280" y="875.0" width="327.2" height="11" rx="3" class="c4"/><text x="613.2" y="884.5" class="s t1">93.5</text><rect x="280" y="889.0" width="336.0" height="7" rx="3" class="c3"/><text x="622.0" y="896.5" class="s">96.0</text><rect x="280" y="899.0" width="273.0" height="7" rx="3" class="cx"/><text x="559.0" y="906.5" class="s">78.0</text><text x="736" y="894.5" class="m t1 end">−2.5</text></g><text x="24" y="935" class="s t3">Lamba 0.1 to 0.4 loop results are like-for-like runs at repetition penalty 1.05. Stock Qwen is shown at penalty 1.1 (no-</text><text x="24" y="949" class="s t3">penalty values are in each row's hover text) and favours stock Qwen relative to its provider default. Own test sets and</text><text x="24" y="963" class="s t3">harnesses on one machine, not independently reproduced. Lamba 0.4 is on a different base than 0.1 to 0.3.</text></svg>
